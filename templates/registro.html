{% extends "base.html" %}
{% block title %}Registro{% endblock %}

{% block contenido %}
<h2>Crear cuenta</h2>

{% if docentes %}
<form method="post" action="/registro">
    <label>Nombre completo</label>
    <input type="text" name="nombre" required>

    <label>Correo</label>
    <input type="email" name="correo" required>

    <label>Contraseña</label>
    <input type="password" name="password" required>

    <label>Rol</label>
    <select name="rol" required>
        <option value="estudiante">Estudiante</option>
        <option value="docente">Docente</option>
        <option value="deposito">Encargado de depósito</option>
    </select>

    <label>Docente asignado (solo estudiantes)</label>
    <select name="correo_docente">
        <option value="">— Ninguno —</option>
        {% for d in docentes %}
        <option value="{{ d.correo }}">{{ d.nombre }} ({{ d.correo }})</option>
        {% endfor %}
    </select>

    <button type="submit">Registrarme</button>
</form>
{% else %}
<p>No hay docentes registrados todavía. Primero debe registrarse un docente.</p>
{% endif %}

<p><a href="/login">Volver al inicio de sesión</a></p>
{% endblock %}
