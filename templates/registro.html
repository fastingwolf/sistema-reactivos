{% extends "base.html" %}
{% block title %}Crear Cuenta - ReactivosLab{% endblock %}

{% block contenido %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand-icon">
                <i class="bi bi-person-plus"></i>
            </div>
            <h2>Crear Cuenta</h2>
            <p>Registro de usuarios para el laboratorio</p>
        </div>

        <form method="POST" action="/registro" class="auth-form" id="registroForm">
            <!-- Nombre -->
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-person"></i>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre y Apellido" required autofocus>
                </div>
            </div>

            <!-- Correo -->
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                </div>
            </div>

            <!-- Rol -->
            <div class="form-group">
                <label for="rol">Tipo de Usuario (Rol)</label>
                <div class="input-icon-wrapper select-wrapper">
                    <i class="bi bi-shield-lock"></i>
                    <select id="rol" name="rol" required onchange="cambiarRol()">
                        {% if not docentes %}
                            <option value="docente" selected>Docente</option>
                            <option value="deposito">Personal de Depósito</option>
                            <option value="admin">Administrador</option>
                        {% else %}
                            <option value="estudiante" selected>Estudiante</option>
                            <option value="docente">Docente</option>
                            <option value="deposito">Personal de Depósito</option>
                            <option value="admin">Administrador</option>
                        {% endif %}
                    </select>
                </div>
            </div>

            <!-- Selección de Docente a cargo (Solo visible y activo para Estudiantes) -->
            <div class="form-group" id="grupoDocente" style="{% if not docentes %}display: none;{% endif %}">
                <label for="docente_id">Docente asignado</label>
                <div class="input-icon-wrapper select-wrapper">
                    <i class="bi bi-mortarboard"></i>
                    <select id="docente_id" name="docente_id">
                        <option value="" disabled selected>Selecciona a tu docente</option>
                        {% for d in docentes %}
                            <option value="{{ d.id }}">{{ d.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <span>Completar Registro</span>
                <i class="bi bi-check2-circle"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
        </div>
    </div>
</div>

<script>
function cambiarRol() {
    const rolSelect = document.getElementById("rol");
    const grupoDocente = document.getElementById("grupoDocente");
    const docenteInput = document.getElementById("docente_id");

    if (rolSelect.value !== "estudiante") {
        grupoDocente.style.display = "none";
        if (docenteInput) {
            docenteInput.required = false;
            docenteInput.disabled = true; // Impide el envío del campo vacío que causa el Error 500
        }
    } else {
        grupoDocente.style.display = "flex";
        if (docenteInput) {
            docenteInput.required = true;
            docenteInput.disabled = false;
        }
    }
}
document.addEventListener("DOMContentLoaded", cambiarRol);
</script>
{% endblock %}
