<!-- templates/escaner.html -->
{% extends "base.html" %}

{% block title %}Escanear Contenedor{% endblock %}

{% block contenido %}
<h2>Escanear Código QR</h2>
<div id="reader" style="width: 300px; margin: auto;"></div>
<form id="form-escaneo" method="post" action="/escaner/procesar" style="display:none;">
    <input type="hidden" name="codigo" id="codigo-escaneado">
</form>
<p id="estado">Apunta la cámara al código QR del frasco.</p>

<!-- Carga la librería de escaneo -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    function onScanSuccess(decodedText, decodedResult) {
        // Detiene el escáner para no escanear varias veces
        html5QrcodeScanner.clear();
        
        // Muestra el código detectado y envía el formulario
        document.getElementById('estado').innerText = 'Código detectado: ' + decodedText;
        document.getElementById('codigo-escaneado').value = decodedText;
        document.getElementById('form-escaneo').submit();
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>
{% endblock %}
