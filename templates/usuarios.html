{% extends "base.html" %}
{% block title %}Usuarios{% endblock %}

{% block contenido %}
<h2>Usuarios registrados</h2>
<table>
    <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Activo</th></tr>
    {% for u in usuarios %}
    <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.nombre }}</td>
        <td>{{ u.correo }}</td>
        <td>{{ u.rol }}</td>
        <td>{{ "Sí" if u.activo else "No" }}</td>
    </tr>
    {% endfor %}
</table>
<p><a href="/menu">← Volver al menú</a></p>
{% endblock %}
